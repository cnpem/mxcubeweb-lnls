%YAML 1.2
---
class: LNLS.EPICS.EPICSActuator.EPICSActuatorBluesky
epics:
  "MNC:A:DCM01:":
    channels:
      rbv:
        suffix: "GonRx_Energy_RBV"
        polling_period: 200
      val:
        suffix: "Energy_SP"
configuration:
  tolerance: 0.01
  plan_name: "move_energy_and_phase"
  plan_parameter: "energy"
  limits: (5, 20)
