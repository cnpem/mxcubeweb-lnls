---

server:
  SECRET_KEY: ASECRETKEY
  SECURITY_PASSWORD_SALT: ASALT
  PERMANENT_SESSION_LIFETIME: 60
  DEBUG: false
  USER_DB_PATH: /tmp/mxcube-user.db
  HOST: 0.0.0.0
  PORT: 8081

sso:
  USE_SSO: true
  META_DATA_URI: https://websso.cnpem.br/realms/LNLS/.well-known/openid-configuration
  LOGOUT_URI: https://websso.cnpem.br/realms/LNLS/protocol/openid-connect/logout
  CLIENT_ID: _ENV_CLIENT_ID

mxcube:
  VIDEO_FORMAT: MPEG1
  VIDEO_STREAM_URL: ws://10.20.66.56:8000/ws
  VIDEO_STREAM_PORT: 8000
  # Start OAV stream from MXCuBE process
  MXCUBE_STARTS_VIDEO_STREAM: true
  mode: OSC
  SESSION_REFRESH_INTERVAL: 9000
  usermanager:
    class: UserManager
    inhouse_is_staff: true
    users:
      - username: no_user
        role: staff